name: Build and Release Extension

on:
  push:
    branches: [master]
    paths:
      - 'manifest.json'
      - 'background.js'
      - 'content_script.js'
      - 'panel.html'
      - 'panel.js'
      - 'popup.html'
      - 'styles.css'
      - 'commands.json'
      - 'devtools.html'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source repo
        uses: actions/checkout@v4

      - name: Read version
        id: version
        run: |
          VERSION=$(grep '"version"' manifest.json | sed 's/.*"version": "\([^"]*\)".*/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Package files
        run: |
          mkdir -p release
          for f in manifest.json background.js content_script.js panel.html panel.js popup.html styles.css commands.json devtools.html updates.xml; do
            cp "$f" "release/$f"
          done
          cd release
          zip -r GMHelper.zip manifest.json background.js content_script.js panel.html panel.js popup.html styles.css commands.json devtools.html updates.xml

      - name: Update updates.xml
        run: |
          cd release
          sed -i "s/version='[^']*'/version='${{ steps.version.outputs.version }}'/" updates.xml

      - name: Push to updates repo
        uses: actions/github-script@v7
        env:
          GITHUB_WORKSPACE: ${{ github.workspace }}
          VERSION: ${{ steps.version.outputs.version }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const workspace = process.env.GITHUB_WORKSPACE;
            const files = ['manifest.json','background.js','content_script.js','panel.html','panel.js','popup.html','styles.css','commands.json','devtools.html','updates.xml','GMHelper.zip'];
            const owner = 'wiszz23';
            const repo = 'moonton-gmhelper-updates';
            for (const file of files) {
              const filePath = path.join(workspace, 'release', file);
              if (!fs.existsSync(filePath)) { continue; }
              const content = fs.readFileSync(filePath);
              let sha = null;
              try {
                const existing = await github.rest.repos.getContent({ owner, repo, path: file });
                sha = existing.data.sha;
              } catch (e) {}
              await github.rest.repos.createOrUpdateFileContents({
                owner, repo, path: file,
                message: 'chore: update extension v' + process.env.VERSION,
                content: Buffer.from(content).toString('base64'),
                sha,
                committer: { name: 'GitHub Actions', email: 'actions@github.com' }
              });
              console.log('已上传: ' + file);
            }

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          body: '版本 v${{ steps.version.outputs.version }}，Chrome 会自动检测更新'
          files: release/GMHelper.zip
        env:
          GITHUB_TOKEN: ${{ secrets.UPDATE_TOKEN }}
