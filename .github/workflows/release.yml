name: Build and Release Extension

on:
  push:
    branches: [master]
    paths:
      - 'manifest.json'
      - 'background.js'
      - 'content_script.js'
      - 'panel.html'
      - 'panel.js'
      - 'popup.html'
      - 'styles.css'
      - 'commands.json'
      - 'devtools.html'
      - '.github/workflows/release.yml'
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build zip
        run: |
          mkdir -p release
          cp manifest.json background.js content_script.js panel.html panel.js popup.html styles.css commands.json devtools.html release/
          cd release
          zip -r GMHelper.zip manifest.json background.js content_script.js panel.html panel.js popup.html styles.css commands.json devtools.html

      - name: Create updates.json
        run: |
          cd release
          VERSION=$(grep '"version"' ../manifest.json | sed 's/.*"version": "\([^"]*\)".*/\1/')
          echo "{\"version\":\"$VERSION\",\"downloadUrl\":\"https://wiszz23.github.io/Moonton-GMHelper/GMHelper.zip\"}" > updates.json

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: release
          target-folder: .
          branch: gh-pages
          commit-message: 'chore: release v${{ hashFiles(''manifest.json'') }}'
