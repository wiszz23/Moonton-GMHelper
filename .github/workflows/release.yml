name: Build and Release Extension

on:
  push:
    branches: [master]
    paths:
      - 'manifest.json'
      - 'background.js'
      - 'content_script.js'
      - 'panel.html'
      - 'panel.js'
      - 'popup.html'
      - 'styles.css'
      - 'commands.json'
      - 'devtools.html'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source repo
        uses: actions/checkout@v4

      - name: Package extension
        run: |
          mkdir -p release
          for f in manifest.json background.js content_script.js panel.html panel.js popup.html styles.css commands.json devtools.html updates.xml; do
            cp "$f" "release/$f"
          done
          cd release
          zip -r GMHelper.zip manifest.json background.js content_script.js panel.html panel.js popup.html styles.css commands.json devtools.html updates.xml

      - name: Update version in updates.xml
        run: |
          cd release
          VERSION=$(grep '"version"' ../manifest.json | sed 's/.*"version": "\([^"]*\)".*/\1/')
          sed -i "s/version='[^']*'/version='$VERSION'/" updates.xml
          echo "更新版本为: $VERSION"

      - name: Push release files to updates repo
        uses: dawidd6/action-push-to-another-repository@v1
        with:
          source_repo: release
          destination_repo: wiszz23/moonton-gmhelper-updates
          destination_branch: main
          commit_message: 'chore: update extension'
          api_token: ${{ secrets.UPDATE_TOKEN }}

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ hashFiles('manifest.json') }}
          body: 'Chrome 会自动检测更新'
          files: release/GMHelper.zip
        env:
          GITHUB_TOKEN: ${{ secrets.UPDATE_TOKEN }}
