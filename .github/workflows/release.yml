name: Build and Release Extension

on:
  push:
    branches: [master]
    paths:
      - 'manifest.json'
      - 'background.js'
      - 'content_script.js'
      - 'panel.html'
      - 'panel.js'
      - 'popup.html'
      - 'styles.css'
      - 'commands.json'
      - 'devtools.html'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source repo
        uses: actions/checkout@v4

      - name: Read version
        id: version
        run: |
          VERSION=$(grep '"version"' manifest.json | sed 's/.*"version": "\([^"]*\)".*/\1/')
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Package and prepare release
        run: |
          mkdir -p release
          cp manifest.json background.js content_script.js panel.html panel.js popup.html styles.css commands.json devtools.html updates.xml release/
          cd release
          zip -r GMHelper.zip manifest.json background.js content_script.js panel.html panel.js popup.html styles.css commands.json devtools.html updates.xml

      - name: Update version in updates.xml
        run: |
          sed -i "s/version='[^']*'/version='$VERSION'/" release/updates.xml
          echo "updates.xml 已更新为版本 $VERSION"

      - name: Push to updates repository
        uses: dawidd6/action-push-to-another-repository@v1
        with:
          source_repo: .
          destination_repo: wiszz23/moonton-gmhelper-updates
          target_folder: .
          include: "release/*"
          exclude: ""
          commit_message: "chore: update extension v${{ env.VERSION }}"
          api_token: ${{ secrets.UPDATE_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          body: '版本 v${{ env.VERSION }}，Chrome 会自动检测更新'
          files: release/GMHelper.zip
        env:
          GITHUB_TOKEN: ${{ secrets.UPDATE_TOKEN }}
