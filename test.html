<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>API 连接测试</title>
  <style>
    body { font-family: Arial; margin: 20px; }
    .box { border: 1px solid #ddd; padding: 10px; margin: 10px 0; border-radius: 4px; }
    button { padding: 8px 16px; margin: 5px; cursor: pointer; }
    textarea { width: 100%; height: 200px; font-family: monospace; }
  </style>
</head>
<body>
  <h1>GM 后端 API 连接测试</h1>

  <div class="box">
    <h2>API 地址</h2>
    <input type="text" id="apiUrl" value="http://10.30.138.5:3000" style="width: 300px;">
    <button onclick="testHealth()">测试连接</button>
  </div>

  <div class="box">
    <h2>查询数据</h2>
    <input type="text" id="ownerName" placeholder="输入 owner 名称" value="public" style="width: 300px;">
    <button onclick="queryData()">查询</button>
  </div>

  <div class="box">
    <h2>结果</h2>
    <textarea id="result" readonly></textarea>
  </div>

  <div class="box">
    <h2>保存数据</h2>
    <input type="text" id="saveOwner" placeholder="owner 名称" value="test_data" style="width: 300px;">
    <br>
    <textarea id="saveJson" placeholder="输入 JSON" style="width: 100%; height: 100px;"></textarea>
    <button onclick="saveData()">保存</button>
  </div>

  <script>
    function log(msg) {
      document.getElementById('result').value += new Date().toLocaleTimeString() + ' | ' + msg + '\n';
    }

    function clear() {
      document.getElementById('result').value = '';
    }

    async function testHealth() {
      clear();
      const url = document.getElementById('apiUrl').value;
      try {
        log('正在连接: ' + url + '/api/health ...');
        const res = await fetch(url + '/api/health');
        log('HTTP Status: ' + res.status);
        const data = await res.json();
        log('响应: ' + JSON.stringify(data, null, 2));
      } catch (e) {
        log('❌ 错误: ' + e.message);
      }
    }

    async function queryData() {
      clear();
      const url = document.getElementById('apiUrl').value;
      const owner = document.getElementById('ownerName').value;
      try {
        log('正在查询: ' + owner);
        const res = await fetch(url + '/api/commands/' + encodeURIComponent(owner));
        log('HTTP Status: ' + res.status);
        const data = await res.json();

        if (data.commands) {
          try {
            const parsed = JSON.parse(data.commands);
            log('数据已解析，共 ' + JSON.stringify(parsed).length + ' 字节');
            document.getElementById('saveJson').value = JSON.stringify(parsed, null, 2);
          } catch (e) {
            log('数据: ' + data.commands.substring(0, 200));
          }
        } else {
          log('暂无数据 (commands 为 null)');
        }
        log('完整响应: ' + JSON.stringify(data, null, 2));
      } catch (e) {
        log('❌ 错误: ' + e.message);
      }
    }

    async function saveData() {
      clear();
      const url = document.getElementById('apiUrl').value;
      const owner = document.getElementById('saveOwner').value;
      const jsonStr = document.getElementById('saveJson').value;

      if (!owner || !jsonStr) {
        log('❌ owner 和 JSON 都不能为空');
        return;
      }

      try {
        const obj = JSON.parse(jsonStr);
        log('正在保存: ' + owner);

        const res = await fetch(url + '/api/commands', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            owner: owner,
            commands: JSON.stringify(obj)
          })
        });

        log('HTTP Status: ' + res.status);
        const data = await res.json();
        log('响应: ' + JSON.stringify(data, null, 2));
      } catch (e) {
        log('❌ 错误: ' + e.message);
      }
    }

    // 页面加载时自动测试
    window.addEventListener('load', () => {
      log('页面已加载，点击按钮开始测试');
    });
  </script>
</body>
</html>
