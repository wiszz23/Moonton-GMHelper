<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GM 数据管理工具</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f5f5f5; color: #333; }
    .container { display: flex; flex-direction: column; height: 100vh; }
    .header { background: #fff; border-bottom: 1px solid #ddd; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; }
    .header h1 { font-size: 16px; font-weight: 600; }
    .header-actions { display: flex; gap: 8px; align-items: center; }
    .header-actions button { padding: 6px 12px; border: 1px solid #ddd; background: #fff; border-radius: 4px; cursor: pointer; font-size: 12px; }
    .header-actions button:hover { background: #f5f5f5; }
    .status { font-size: 12px; color: #999; margin-left: 12px; }
    .status.connected::before { content: "● "; color: #4caf50; }
    .status.disconnected::before { content: "● "; color: #d32f2f; }
    .query-bar { background: #fff; padding: 12px 16px; border-bottom: 1px solid #ddd; display: flex; gap: 8px; align-items: center; }
    .query-bar input { padding: 8px 12px; border: 1px solid #ddd; border-radius: 4px; font-size: 13px; flex: 1; max-width: 400px; }
    .query-bar button { padding: 8px 16px; background: #42a5f5; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-size: 13px; }
    .query-bar button:hover { background: #1976d2; }
    .content { display: flex; flex: 1; overflow: hidden; gap: 0; }
    .list-panel { width: 280px; border-right: 1px solid #ddd; display: flex; flex-direction: column; background: #fff; }
    .list-header { padding: 12px 16px; border-bottom: 1px solid #ddd; font-size: 12px; font-weight: 600; color: #666; display: flex; justify-content: space-between; align-items: center; }
    .list-header button { background: #4caf50; color: #fff; border: none; border-radius: 3px; padding: 4px 8px; font-size: 11px; cursor: pointer; }
    .list-header button:hover { background: #388e3c; }
    .list-items { flex: 1; overflow-y: auto; padding: 8px; }
    .list-item { padding: 8px 12px; margin: 4px 0; background: #f5f5f5; border: 1px solid #ddd; border-radius: 4px; cursor: pointer; font-size: 12px; transition: all 200ms; display: flex; justify-content: space-between; align-items: center; }
    .list-item:hover { background: #fff; border-color: #42a5f5; }
    .list-item.selected { background: #e3f2fd; border-color: #42a5f5; font-weight: 600; }
    .list-item .delete-btn { background: #d32f2f; color: #fff; border: none; border-radius: 2px; padding: 2px 6px; font-size: 10px; cursor: pointer; display: none; }
    .list-item:hover .delete-btn { display: block; }
    .list-item .delete-btn:hover { background: #c62828; }
    .editor-panel { flex: 1; display: flex; flex-direction: column; background: #fff; }
    .editor-header { padding: 12px 16px; border-bottom: 1px solid #ddd; display: flex; gap: 8px; background: #fafafa; flex-wrap: wrap; align-items: center; }
    .editor-header span { font-size: 12px; color: #666; font-weight: 600; }
    .editor-header button { padding: 6px 12px; border: 1px solid #ddd; background: #fff; border-radius: 4px; cursor: pointer; font-size: 12px; }
    .editor-header button:hover { background: #f5f5f5; }
    .editor-header button.primary { background: #4caf50; color: #fff; border-color: #4caf50; }
    .editor-header button.primary:hover { background: #388e3c; }
    .editor-header button.danger { background: #d32f2f; color: #fff; border-color: #d32f2f; }
    .editor-header button.danger:hover { background: #c62828; }
    .json-editor { flex: 1; overflow: hidden; }
    textarea { width: 100%; height: 100%; border: none; padding: 12px; font-family: "Monaco", "Courier New", monospace; font-size: 12px; resize: none; line-height: 1.5; background: #fafafa; }
    textarea:focus { outline: none; background: #fff; }
    .modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 1000; }
    .modal.active { display: flex; align-items: center; justify-content: center; }
    .modal-content { background: #fff; border-radius: 8px; box-shadow: 0 4px 20px rgba(0,0,0,0.15); max-width: 500px; width: 90%; }
    .modal-header { padding: 16px; border-bottom: 1px solid #ddd; display: flex; justify-content: space-between; align-items: center; }
    .modal-header h2 { font-size: 14px; font-weight: 600; }
    .modal-close { background: none; border: none; font-size: 20px; cursor: pointer; color: #999; }
    .modal-body { padding: 16px; }
    .modal-footer { padding: 12px 16px; border-top: 1px solid #ddd; display: flex; gap: 8px; justify-content: flex-end; }
    .modal-footer button { padding: 8px 16px; border: 1px solid #ddd; background: #fff; border-radius: 4px; cursor: pointer; font-size: 12px; }
    .modal-footer button.primary { background: #4caf50; color: #fff; border-color: #4caf50; }
    .toast-container { position: fixed; bottom: 20px; right: 20px; z-index: 2000; }
    .toast { background: #323232; color: #fff; padding: 12px 16px; border-radius: 4px; margin-bottom: 8px; font-size: 12px; animation: slideIn 300ms ease-out; }
    .toast.success { background: #4caf50; }
    .toast.error { background: #d32f2f; }
    @keyframes slideIn { from { transform: translateX(400px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    .form-group { display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; }
    .form-group label { font-size: 12px; font-weight: 600; color: #333; }
    .form-group input { padding: 8px; border: 1px solid #ddd; border-radius: 4px; font-size: 12px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>GM 数据管理工具</h1>
      <div class="header-actions">
        <button onclick="loadOwnerList()">🔄 刷新</button>
        <button onclick="openSettings()">⚙️ 设置</button>
        <span class="status disconnected" id="connectionStatus">未连接</span>
      </div>
    </div>

    <div class="query-bar">
      <input type="text" id="ownerInput" placeholder="输入新的 owner 名称" oninput="filterOwnerList()" onkeypress="if(event.key==='Enter') queryData()">
      <button onclick="queryData()">🔍 查询</button>
      <button onclick="exportJSON()" style="background: #ff9800;">📥 导出</button>
      <button onclick="importJSON()" style="background: #9c27b0;">📤 导入</button>
    </div>

    <div class="content">
      <div class="list-panel">
        <div class="list-header">
          Owner 列表
          <button onclick="clearOwnerList()" title="清空历史">✕</button>
        </div>
        <div class="list-items" id="ownerList">
          <div style="text-align: center; color: #999; padding: 20px; font-size: 12px;">查询 owner 后会显示在这里</div>
        </div>
      </div>

      <div class="editor-panel">
        <div class="editor-header">
          <span id="ownerLabel">未选择</span>
          <button onclick="renameOwner()" id="renameBtn" disabled style="margin-left: 8px; font-size: 11px; padding: 4px 8px;">✏️ 重命名</button>
          <div style="flex: 1;"></div>
          <button onclick="formatJSON()">📐 格式化</button>
          <button onclick="validateJSON()">✓ 验证</button>
          <button class="primary" onclick="saveData()">💾 保存到 DB</button>
          <button class="danger" onclick="deleteData()" id="deleteBtn" disabled>🗑️ 删除</button>
        </div>
        <div class="json-editor">
          <textarea id="jsonEditor" placeholder="选择 owner 后，编辑 JSON 数据"></textarea>
        </div>
      </div>
    </div>
  </div>

  <div class="modal" id="settingsModal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>连接设置</h2>
        <button class="modal-close" onclick="closeSettings()">×</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label>API 地址</label>
          <input type="text" id="apiUrl" placeholder="http://10.30.138.5:3000">
        </div>
        <div class="form-group">
          <label>请求超时 (毫秒)</label>
          <input type="number" id="requestTimeout" value="10000" min="1000" max="60000">
        </div>
      </div>
      <div class="modal-footer">
        <button onclick="resetSettings()">重置默认</button>
        <button onclick="closeSettings()">取消</button>
        <button class="primary" onclick="saveSettings()">保存</button>
      </div>
    </div>
  </div>

  <div class="toast-container" id="toastContainer"></div>
  <input type="file" id="fileInput" style="display: none;" accept=".json,.txt">

  <script>
    const DEFAULT_CONFIG = { API_BASE_URL: 'http://10.30.138.5:3000', REQUEST_TIMEOUT: 10000 };
    let CONFIG = { ...DEFAULT_CONFIG };
    let currentOwner = null;
    const ownerCache = {}; // { owner: { display: formattedJson } }

    window.addEventListener('DOMContentLoaded', () => {
      console.log('[App] 页面已加载');
      loadConfig();
      console.log('[App] 配置已加载:', CONFIG);
      testConnection();
      loadOwnerList();
    });

    function loadConfig() {
      const saved = localStorage.getItem('gm_config');
      if (saved) {
        try { CONFIG = JSON.parse(saved); } catch (e) { CONFIG = { ...DEFAULT_CONFIG }; }
      }
    }

    function saveConfig() { localStorage.setItem('gm_config', JSON.stringify(CONFIG)); }

    function openSettings() {
      document.getElementById('apiUrl').value = CONFIG.API_BASE_URL;
      document.getElementById('requestTimeout').value = CONFIG.REQUEST_TIMEOUT;
      document.getElementById('settingsModal').classList.add('active');
    }

    function closeSettings() { document.getElementById('settingsModal').classList.remove('active'); }

    function saveSettings() {
      CONFIG.API_BASE_URL = document.getElementById('apiUrl').value || DEFAULT_CONFIG.API_BASE_URL;
      CONFIG.REQUEST_TIMEOUT = parseInt(document.getElementById('requestTimeout').value) || DEFAULT_CONFIG.REQUEST_TIMEOUT;
      saveConfig();
      closeSettings();
      showToast('设置已保存', 'success');
    }

    function resetSettings() {
      CONFIG = { ...DEFAULT_CONFIG };
      saveConfig();
      document.getElementById('apiUrl').value = CONFIG.API_BASE_URL;
      document.getElementById('requestTimeout').value = CONFIG.REQUEST_TIMEOUT;
      showToast('已恢复默认设置', 'success');
    }

    async function fetchAPI(endpoint, options = {}) {
      const url = CONFIG.API_BASE_URL + endpoint;
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), CONFIG.REQUEST_TIMEOUT);

      try {
        console.log('[fetchAPI] 请求:', url);
        const response = await fetch(url, {
          ...options,
          signal: controller.signal,
          headers: { 'Content-Type': 'application/json', ...options.headers }
        });
        console.log('[fetchAPI] 响应状态:', response.status, response.statusText);
        clearTimeout(timeoutId);
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const data = await response.json();
        console.log('[fetchAPI] 响应数据:', data);
        updateConnectionStatus(true);
        return data;
      } catch (error) {
        clearTimeout(timeoutId);
        console.error('[fetchAPI] 请求失败:', error.message);
        updateConnectionStatus(false);
        throw error;
      }
    }

    function updateConnectionStatus(connected = null) {
      if (connected !== null) {
        const status = document.getElementById('connectionStatus');
        if (connected) {
          status.textContent = '✓ 已连接';
          status.className = 'status connected';
        } else {
          status.textContent = '✗ 连接失败';
          status.className = 'status disconnected';
        }
      }
    }

    async function testConnection() {
      try { await fetchAPI('/api/health'); } catch (error) { showToast('无法连接到后端', 'error'); }
    }

    async function loadOwnerList() {
      try {
        console.log('[loadOwnerList] 开始加载 owner 列表...');
        console.log('[loadOwnerList] API 地址:', CONFIG.API_BASE_URL);

        // 从后端获取所有 owner（含完整数据，预热缓存）
        const result = await fetchAPI('/api/commands/list?limit=10000&full=1');
        console.log('[loadOwnerList] 后端返回:', result);

        // 预热缓存
        result.data.owners.forEach(o => {
          let display = '{}';
          if (o.commands) {
            try { display = JSON.stringify(JSON.parse(o.commands), null, 2); } catch (e) { display = o.commands; }
          }
          ownerCache[o.owner] = { display };
        });

        const owners = result.data.owners.map(o => o.owner);
        console.log('[loadOwnerList] 解析出 owner 数量:', owners.length);
        console.log('[loadOwnerList] 前 5 个 owner:', owners.slice(0, 5));

        const listContainer = document.getElementById('ownerList');
        if (owners.length === 0) {
          listContainer.innerHTML = '<div style="text-align: center; color: #999; padding: 20px; font-size: 12px;">暂无数据</div>';
        } else {
          listContainer.innerHTML = owners.map(owner =>
            `<div class="list-item" onclick="selectOwner('${owner}')"><span>${owner}</span><button class="delete-btn" onclick="event.stopPropagation(); deleteOwner('${owner}')">删除</button></div>`
          ).join('');
        }

        console.log('[loadOwnerList] 页面已更新，共', owners.length, '个 owner');
        showToast(`已加载 ${owners.length} 个 owner`, 'success');
      } catch (error) {
        console.error('[loadOwnerList] 错误:', error);
        console.error('[loadOwnerList] 错误堆栈:', error.stack);
        showToast('加载 owner 列表失败：' + error.message, 'error');
      }
    }

    function selectOwner(owner) {
      console.log('[selectOwner] 选择 owner:', owner);
      document.getElementById('ownerInput').value = owner;
      // 高亮选中项，不重新加载列表
      highlightSelectedOwner(owner);
      queryData();
    }

    function highlightSelectedOwner(owner) {
      // 移除所有已选中状态
      document.querySelectorAll('.list-item').forEach(item => {
        item.classList.remove('selected');
      });
      // 高亮当前选中项
      document.querySelectorAll('.list-item').forEach(item => {
        const ownerText = item.querySelector('span').textContent;
        if (ownerText === owner) {
          item.classList.add('selected');
        }
      });
    }

    function addOwnerToList(owner) {
      console.log('[addOwnerToList] 记录 owner 到历史:', owner);
      let owners = [];
      const saved = localStorage.getItem('gm_owners');
      if (saved) {
        try { owners = JSON.parse(saved); } catch (e) {}
      }
      owners = owners.filter(o => o !== owner);
      owners.unshift(owner);
      owners = owners.slice(0, 50);
      localStorage.setItem('gm_owners', JSON.stringify(owners));
      // 只高亮，不重新加载列表
      highlightSelectedOwner(owner);
    }

    async function deleteOwner(owner) {
      console.log('[deleteOwner] 删除 owner:', owner);
      if (!confirm(`确定要删除 "${owner}" 吗？`)) return;
      try {
        await fetchAPI(`/api/commands/${encodeURIComponent(owner)}`, { method: 'DELETE' });
        // 从 DOM 中移除
        document.querySelectorAll('.list-item').forEach(item => {
          const ownerText = item.querySelector('span').textContent;
          if (ownerText === owner) {
            item.remove();
          }
        });
        delete ownerCache[owner];
        // 如果删除的是当前选中的 owner，清空编辑器
        if (currentOwner === owner) {
          currentOwner = null;
          document.getElementById('jsonEditor').value = '';
          document.getElementById('ownerInput').value = '';
          document.getElementById('ownerLabel').textContent = '未选择';
          document.getElementById('deleteBtn').disabled = true;
          document.getElementById('renameBtn').disabled = true;
        }
        showToast(`已删除 "${owner}"`, 'success');
      } catch (error) {
        showToast('删除失败：' + error.message, 'error');
      }
    }

    function filterOwnerList() {
      const keyword = document.getElementById('ownerInput').value.trim().toLowerCase();
      document.querySelectorAll('.list-item').forEach(item => {
        const ownerText = item.querySelector('span').textContent.toLowerCase();
        item.style.display = (!keyword || ownerText.includes(keyword)) ? '' : 'none';
      });
    }

    function clearOwnerList() {
      if (confirm('确定要清空 owner 列表吗？')) {
        localStorage.removeItem('gm_owners');
        loadOwnerList();
      }
    }

    async function queryData() {
      const owner = document.getElementById('ownerInput').value.trim();
      if (!owner) {
        showToast('请输入 owner 名称', 'error');
        return;
      }

      // 检查缓存
      const cached = ownerCache[owner];
      if (cached) {
        currentOwner = owner;
        document.getElementById('jsonEditor').value = cached.display;
        document.getElementById('ownerLabel').textContent = `Owner: ${owner}`;
        document.getElementById('jsonEditor').disabled = false;
        document.getElementById('deleteBtn').disabled = false;
        document.getElementById('renameBtn').disabled = false;
        highlightSelectedOwner(owner);
        showToast(`已加载: ${owner} (缓存)`, 'success');
        return;
      }

      // 显示加载中状态
      document.getElementById('ownerLabel').textContent = `Owner: ${owner} (加载中...)`;
      document.getElementById('jsonEditor').value = '';
      document.getElementById('jsonEditor').disabled = true;
      document.getElementById('deleteBtn').disabled = true;

      try {
        const result = await fetchAPI(`/api/commands/${encodeURIComponent(owner)}`);
        currentOwner = owner;

        let jsonData = null;
        if (result.commands) {
          try { jsonData = JSON.parse(result.commands); } catch (e) { jsonData = result.commands; }
        }

        const display = jsonData ? JSON.stringify(jsonData, null, 2) : '{}';
        // 写入缓存
        ownerCache[owner] = { display };

        document.getElementById('jsonEditor').value = display;
        document.getElementById('ownerLabel').textContent = `Owner: ${owner}`;
        document.getElementById('jsonEditor').disabled = false;
        document.getElementById('deleteBtn').disabled = false;
        document.getElementById('renameBtn').disabled = false;

        highlightSelectedOwner(owner);
        showToast(`已加载: ${owner}`, 'success');
      } catch (error) {
        document.getElementById('ownerLabel').textContent = `Owner: ${owner} (加载失败)`;
        document.getElementById('jsonEditor').disabled = false;
        showToast('查询失败：' + error.message, 'error');
      }
    }

    async function saveData() {
      if (!currentOwner) {
        showToast('请先查询一条数据', 'error');
        return;
      }

      try {
        const text = document.getElementById('jsonEditor').value;
        const jsonData = JSON.parse(text);
        await fetchAPI('/api/commands', {
          method: 'POST',
          body: JSON.stringify({ owner: currentOwner, commands: JSON.stringify(jsonData) })
        });
        // 更新缓存
        ownerCache[currentOwner] = { display: JSON.stringify(jsonData, null, 2), ts: Date.now() };
        showToast('数据已保存到数据库', 'success');
      } catch (error) {
        showToast('保存失败：' + error.message, 'error');
      }
    }

    async function deleteData() {
      if (!currentOwner) {
        showToast('请先查询一条数据', 'error');
        return;
      }
      if (!confirm(`确定要删除 "${currentOwner}" 吗？`)) return;
      try {
        const deletedOwner = currentOwner;
        await fetchAPI(`/api/commands/${encodeURIComponent(currentOwner)}`, { method: 'DELETE' });
        currentOwner = null;
        document.getElementById('jsonEditor').value = '';
        document.getElementById('ownerInput').value = '';
        document.getElementById('ownerLabel').textContent = '未选择';
        document.getElementById('deleteBtn').disabled = true;
        document.getElementById('renameBtn').disabled = true;
        delete ownerCache[deletedOwner];
        deleteOwner(deletedOwner);
        showToast('数据已删除', 'success');
      } catch (error) {
        showToast('删除失败：' + error.message, 'error');
      }
    }

    async function renameOwner() {
      if (!currentOwner) {
        showToast('请先选择一个 owner', 'error');
        return;
      }
      const newName = prompt(`将 "${currentOwner}" 重命名为：`, currentOwner);
      if (!newName || newName.trim() === '' || newName.trim() === currentOwner) return;
      const trimmed = newName.trim();
      try {
        await fetchAPI('/api/commands/rename', {
          method: 'PUT',
          body: JSON.stringify({ oldOwner: currentOwner, newOwner: trimmed })
        });
        // 更新左侧列表中对应条目
        document.querySelectorAll('.list-item').forEach(item => {
          const span = item.querySelector('span');
          if (span.textContent === currentOwner) {
            span.textContent = trimmed;
            item.setAttribute('onclick', `selectOwner('${trimmed.replace(/'/g, "\\'")}')`);
          }
        });
        // 更新缓存键
        if (ownerCache[currentOwner]) {
          ownerCache[trimmed] = ownerCache[currentOwner];
          delete ownerCache[currentOwner];
        }
        // 更新当前状态
        currentOwner = trimmed;
        document.getElementById('ownerLabel').textContent = `Owner: ${trimmed}`;
        document.getElementById('ownerInput').value = trimmed;
        showToast(`已重命名为 "${trimmed}"`, 'success');
      } catch (error) {
        showToast('重命名失败：' + error.message, 'error');
      }
    }

    function formatJSON() {
      try {
        const text = document.getElementById('jsonEditor').value;
        const obj = JSON.parse(text);
        document.getElementById('jsonEditor').value = JSON.stringify(obj, null, 2);
        showToast('JSON 已格式化', 'success');
      } catch (error) {
        showToast('JSON 格式错误：' + error.message, 'error');
      }
    }

    function validateJSON() {
      try {
        const text = document.getElementById('jsonEditor').value;
        JSON.parse(text);
        showToast('JSON 格式有效', 'success');
      } catch (error) {
        showToast('JSON 格式错误：' + error.message, 'error');
      }
    }

    function exportJSON() {
      if (!currentOwner) {
        showToast('请先查询一条数据', 'error');
        return;
      }
      try {
        const text = document.getElementById('jsonEditor').value;
        const obj = JSON.parse(text);
        const dataStr = JSON.stringify(obj, null, 2);
        const dataBlob = new Blob([dataStr], { type: 'application/json' });
        const url = URL.createObjectURL(dataBlob);
        const link = document.createElement('a');
        link.href = url;
        link.download = `${currentOwner}_${new Date().getTime()}.json`;
        link.click();
        URL.revokeObjectURL(url);
        showToast('已导出数据', 'success');
      } catch (error) {
        showToast('导出失败：' + error.message, 'error');
      }
    }

    function importJSON() {
      document.getElementById('fileInput').click();
    }

    document.getElementById('fileInput').addEventListener('change', (event) => {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const content = e.target.result;
          const obj = JSON.parse(content);
          document.getElementById('jsonEditor').value = JSON.stringify(obj, null, 2);
          showToast('已导入数据', 'success');
        } catch (error) {
          showToast('导入失败：' + error.message, 'error');
        }
      };
      reader.readAsText(file);
    });

    function showToast(message, type = 'info') {
      const container = document.getElementById('toastContainer');
      const toast = document.createElement('div');
      toast.className = `toast ${type}`;
      toast.textContent = message;
      container.appendChild(toast);
      setTimeout(() => toast.remove(), 3000);
    }

    document.addEventListener('keydown', (event) => {
      if (event.ctrlKey || event.metaKey) {
        if (event.key === 's') { event.preventDefault(); saveData(); }
        else if (event.key === 'e') { event.preventDefault(); exportJSON(); }
        else if (event.key === 'i') { event.preventDefault(); importJSON(); }
      }
    });
  </script>
</body>
</html>
