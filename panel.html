<!DOCTYPE html>
<html>
<head>
  <title>GM助手</title>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <!-- 左侧竖向 Tab 导航 -->
    <div class="sidebar">
      <div class="sidebar-item active" data-panel="gmlist">
        <span class="sidebar-icon">&#9654;</span>
        <span class="sidebar-label">GM列表</span>
      </div>
      <!-- GM列表子选项（动态生成） -->
      <div class="sidebar-sub-items" id="category-tabs">
        <div class="sidebar-sub-item active" data-category="all">全部</div>
        <!-- 分类 tab 由 panel.js 动态填充 -->
      </div>
      <div class="sidebar-item" data-panel="history">
        <span class="sidebar-icon">&#9654;</span>
        <span class="sidebar-label">历史记录</span>
      </div>
    </div>

    <!-- 右侧内容区 -->
    <div class="content-area">

      <!-- GM列表面板 -->
      <div id="panel-gmlist" class="panel-section active">
        <div id="status-area" class="status-area"></div>

        <!-- 通用/个人 分页 -->
        <div class="tab-switch-row">
          <div class="tab-switch">
            <div class="tab-btn active" data-tab="general">通用</div>
            <div class="tab-btn" data-tab="personal">个人</div>
          </div>
          <button id="add-cmd-btn" class="add-cmd-btn" title="添加指令">+ 添加指令</button>
        </div>

        <div class="toolbar-row">
          <div class="input-group toolbar-id">
            <label for="input-text">角色ID</label>
            <input type="text" id="input-text" placeholder="空格分隔多个">
          </div>
          <div class="search-box toolbar-search">
            <input type="text" id="search-input" placeholder="搜索GM指令...">
          </div>
        </div>

        <div class="options-row">
          <div class="checkbox-group">
            <input type="checkbox" id="auto-run-checkbox" checked>
            <label for="auto-run-checkbox">自动执行</label>
          </div>
          <button id="settings-btn" class="settings-btn" title="设置">&#9881;</button>
        </div>

        <div id="settings-panel" class="settings-panel hidden">
          <div class="settings-header">
            <span>域名白名单设置</span>
            <button id="close-settings-btn" class="close-settings-btn">×</button>
          </div>
          <div class="input-group">
            <label for="whitelist-input">白名单域名（每行一个）</label>
            <textarea id="whitelist-input" rows="6" placeholder="http://gm.pre.nova.moonton.com:8201&#10;http://gm.nova.oa.mt:8201&#10;https://gm-cn.yyf.muyinetwork.com:8201&#10;https://gm.jp.novagames.net:8201&#10;https://gm.usa.novagames.net:8201"></textarea>
          </div>
          <button id="save-whitelist-btn" class="save-btn">保存白名单</button>
        </div>

        <div id="buttons-container" class="buttons-container"></div>
      </div>

      <!-- 历史记录面板 -->
      <div id="panel-history" class="panel-section">
        <div id="history-area" class="history-area">
          <div id="history-empty" class="history-empty">暂无执行记录</div>
          <div id="history-list" class="history-list"></div>
        </div>
        <button id="clear-history-btn" class="clear-history-btn">清空历史记录</button>
      </div>

    </div>
  </div>

  <!-- 添加/编辑指令弹层 -->
  <div id="add-cmd-modal" class="modal-overlay hidden">
    <div class="modal-box">
      <div class="modal-header">
        <span id="modal-title">添加自定义指令</span>
        <button id="close-modal-btn" class="modal-close-btn">×</button>
      </div>
      <div class="modal-body">
        <div class="input-group">
          <label for="modal-cmd-name">指令名称</label>
          <input type="text" id="modal-cmd-name" placeholder="例如：给角色加钻石">
        </div>
        <div class="input-group">
          <label for="modal-cmd-text">指令内容</label>
          <textarea id="modal-cmd-text" rows="4" placeholder="例如：add_item %s 90001 99999&#10;%s 或 % 均会被自动替换为角色ID，支持多行"></textarea>
        </div>
        <div class="input-group">
          <label for="modal-cmd-category">分组</label>
          <select id="modal-cmd-category" class="modal-select">
            <option value="装备">装备</option>
            <option value="道具">道具</option>
            <option value="天赋">天赋</option>
            <option value="核心">核心</option>
            <option value="宝石">宝石</option>
            <option value="皮肤">皮肤</option>
            <option value="枪械">枪械</option>
            <option value="城墙">城墙</option>
            <option value="主线关">主线关</option>
            <option value="召唤">召唤</option>
            <option value="战斗">战斗</option>
            <option value="公会">公会</option>
            <option value="玩家">玩家</option>
            <option value="邮件">邮件</option>
            <option value="rogue">rogue</option>
          </select>
        </div>
      </div>
      <div class="modal-footer">
        <button id="modal-cancel-btn" class="modal-cancel-btn">取消</button>
        <button id="modal-confirm-btn" class="modal-confirm-btn">添加</button>
      </div>
    </div>
  </div>
  <script src="panel.js"></script>
</body>
</html>
